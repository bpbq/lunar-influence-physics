name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation environment
        run: |
          python -m pip install -r requirements/validation.lock
          python -m pip install --no-deps -e .
      - name: Public snapshot and tests
        run: |
          python scripts/check_public_snapshot.py
          pytest --junitxml=artifacts/pytest.xml
          python scripts/validation_metrics.py
      - name: Build wheel
        run: python -m build
      - name: Smoke-test installed wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/lipe-wheel
          /tmp/lipe-wheel/bin/python -m pip install dist/*.whl pyarrow==26.0.1
          cd /tmp
          /tmp/lipe-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py" \
            --output-dir /tmp/lipe-wheel-output
          test -f /tmp/lipe-wheel-output/smoke.csv
          test -f /tmp/lipe-wheel-output/smoke.json
          test -f /tmp/lipe-wheel-output/smoke.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lipe-test-and-build-artifacts
          path: |
            artifacts/pytest.xml
            validation/metrics.json
            dist/*

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
