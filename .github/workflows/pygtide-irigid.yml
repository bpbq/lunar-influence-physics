name: Experimental ETERNA IRIGID=1 comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-irigid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned LIPE environment and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran ninja-build
          python -m pip install -r requirements/validation.lock
          python -m pip install --no-deps -e .
          python -m pip install meson==1.9.1
      - name: Build isolated patched PyGTide and recompute diagnostics
        run: experiments/pygtide-irigid/build_and_run.sh /tmp/lipe-pygtide-irigid
      - uses: actions/upload-artifact@v4
        with:
          name: lipe-pygtide-irigid-results
          path: validation/pygtide_residuals_v2/
          if-no-files-found: error
